name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    name: Build & Test (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platforms & Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew executable
        run: chmod +x gradlew

      - name: Clean Gradle build
        run: ./gradlew clean --stacktrace

      - name: Run App Unit & Robolectric tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run Root Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
